<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Магазин ESSENS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f3f1f5);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #1d1620);
    --hint: var(--tg-theme-hint-color, #8a8190);
    --accent: #8e3b79; --accent-ink:#fff; --accent-soft: rgba(142,59,121,.12);
    --line: rgba(127,120,135,.2);
    --ok:#2f9e5b; --low:#e08a1e; --off:#9a93a0;
    --r-lg:22px; --r-md:16px; --r-sm:12px;
    --display:"Unbounded", "Golos Text", system-ui, sans-serif;
    --body:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  html.dark{ --accent:#d47fbe; --accent-ink:#1a0f17; --accent-soft: rgba(212,127,190,.16); --line: rgba(190,180,200,.16); }
  @media (prefers-color-scheme: dark){ html:not(.tg):not(.light){ --bg:#17131a; --bg2:#0f0c11; --card:#211b25; --text:#f1ebf3; --hint:#9d93a3;
    --accent:#d47fbe; --accent-ink:#1a0f17; --accent-soft: rgba(212,127,190,.16); --line: rgba(190,180,200,.16);} }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg2);color:var(--text);font:15px/1.45 var(--body);
       padding-bottom:calc(84px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px}
  h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;letter-spacing:-.2px}
  .muted{color:var(--hint)}
  section{display:none} section.on{display:block}

  /* ── шапка магазина ── */
  .top{background:var(--bg);padding:14px 0 12px;border-radius:0 0 var(--r-lg) var(--r-lg)}
  .hello{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .hello h1{font-size:21px;line-height:1.15}
  .hello .ava{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font:600 15px var(--display);overflow:hidden;flex:0 0 38px}
  .hello .ava img{width:100%;height:100%;object-fit:cover}
  .search{position:relative}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--hint)}
  .search input{width:100%;height:46px;border:0;border-radius:var(--r-md);background:var(--bg2);color:var(--text);
    padding:0 40px 0 40px;font:inherit;outline:none}
  .search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--hint);
    width:34px;height:34px;border-radius:50%;display:none;font-size:18px}
  .search.has .x{display:block}

  .cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
  .cat{border:0;background:transparent;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--hint)}
  .cat .ic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:24px;
    background:color-mix(in srgb, var(--c) 16%, var(--bg));transition:transform .18s, box-shadow .18s}
  .cat.on{color:var(--text);font-weight:600}
  .cat.on .ic{box-shadow:0 0 0 2px var(--c) inset;transform:translateY(-2px)}

  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:0;background:var(--bg2);border-radius:999px;padding:7px 13px;font-size:13px;display:flex;align-items:center;gap:6px}
  .chip.on{background:var(--text);color:var(--bg)}
  .chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}

  .bar{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 10px;font-size:13px;color:var(--hint)}
  .sortb{border:0;background:transparent;color:var(--text);font-size:13px;display:flex;align-items:center;gap:6px;padding:6px 4px}

  /* ── карточки ── */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(min-width:540px){.grid{grid-template-columns:repeat(3,1fr)}}
  .pc{background:var(--card);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column;position:relative}
  .pc.off{opacity:.55}
  .ph{aspect-ratio:1/1;background:#fff;position:relative;display:grid;place-items:center;cursor:pointer;overflow:hidden}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8%;box-sizing:border-box}
  .ph .flac{width:46%;aspect-ratio:3/4;border-radius:14px 14px 18px 18px;display:grid;place-items:center;
    background:linear-gradient(170deg,color-mix(in srgb,var(--c) 30%,#fff),color-mix(in srgb,var(--c) 70%,#fff));
    color:color-mix(in srgb,var(--c) 70%,#000);font:600 13px var(--display);position:relative}
  .ph .flac::before{content:"";position:absolute;top:-14%;left:32%;width:36%;height:14%;border-radius:5px 5px 0 0;background:color-mix(in srgb,var(--c) 55%,#222)}
  .tag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(20,15,22,.72);color:#fff}
  .tag.low{background:var(--low)}
  .pi{padding:10px 11px 11px;display:flex;flex-direction:column;flex:1}
  .scent{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--hint);margin-bottom:4px;min-height:16px;white-space:nowrap;overflow:hidden}
  .scent i{flex:0 0 8px;height:8px;border-radius:50%;background:var(--c)}
  .pi h3{font:600 13.5px/1.25 var(--display);cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .pi .sm{font-size:12px;color:var(--hint);margin-top:3px}
  .pi .buy{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;gap:6px}
  .pi .buy b{font-size:15px;white-space:nowrap}
  .add{width:38px;height:38px;border:0;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:0 0 38px}
  .add svg{transition:transform .2s}
  .add:active svg{transform:rotate(90deg)}
  .step{display:flex;align-items:center;background:var(--accent-soft);border-radius:13px;height:38px;animation:pop .22s ease}
  .step button{border:0;background:transparent;width:32px;height:38px;font-size:18px;color:var(--accent)}
  .step span{min-width:18px;text-align:center;font-weight:600;font-size:14px}
  @keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
  .skel{background:var(--card);border-radius:var(--r-md);height:250px;position:relative;overflow:hidden}
  .skel::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(127,120,135,.12) 50%,transparent 70%);
    animation:shim 1.2s infinite;transform:translateX(-100%)}
  @keyframes shim{to{transform:translateX(100%)}}
  .empty{text-align:center;padding:40px 16px;color:var(--hint)}
  .empty .big{font-size:46px;margin-bottom:6px}
  .empty h2{font-size:17px;color:var(--text);margin-bottom:6px}

  /* ── кнопки ── */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:var(--r-md);
    background:var(--accent);color:var(--accent-ink);font:600 15.5px var(--body);text-decoration:none;transition:transform .12s}
  .btn:active{transform:scale(.98)}
  .btn.soft{background:var(--accent-soft);color:var(--accent)}
  .btn.line{background:transparent;color:var(--text);box-shadow:0 0 0 1px var(--line) inset}
  .btn[disabled]{opacity:.5}

  /* ── шторка ── */
  .ov{position:fixed;inset:0;background:rgba(10,6,12,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
  .ov.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:24px 24px 0 0;max-height:92vh;
    display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
  .sheet.on{transform:none}
  .sheet .grab{flex:0 0 auto;padding:9px 0 4px;touch-action:none}
  .sheet .grab i{display:block;width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
  .sheet .sc{overflow:auto;padding:4px 16px 16px;flex:1;-webkit-overflow-scrolling:touch}
  .sheet .foot{flex:0 0 auto;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
    display:flex;align-items:center;gap:12px;background:var(--bg)}
  .sheet .foot .price{font:600 21px var(--display);margin-right:auto;white-space:nowrap}
  .sheet .foot .btn{width:auto;flex:0 0 auto;padding:0 22px}
  .sheet .foot .step{height:52px;border-radius:var(--r-md)}.sheet .foot .step button{width:44px;height:52px}
  .in-wrap{max-width:640px;margin:0 auto;width:100%}

  .kick{font-size:12.5px;color:var(--accent);font-weight:600;margin-bottom:2px}
  .pimg{aspect-ratio:1/1;max-height:34vh;margin:0 auto 14px;border-radius:var(--r-lg);background:#fff;position:relative;overflow:hidden;display:grid;place-items:center;width:100%}
  .pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6%}
  .pimg .flac{width:30%}
  .ptitle{font:600 22px/1.2 var(--display)}
  .psub{color:var(--hint);margin-top:4px;font-size:14px}
  .insp{margin-top:14px;padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft)}
  .insp span{display:block;font-size:12.5px;color:var(--hint)}
  .insp b{font:600 16px var(--display);color:var(--accent)}
  .notes{display:grid;gap:6px;margin-top:14px}
  .notes div{display:flex;gap:10px;align-items:baseline;font-size:14px}
  .notes span{flex:0 0 64px;color:var(--hint);font-size:12.5px}
  .desc{margin-top:14px;font-size:14.5px;line-height:1.55}
  .desc.cut p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
  .desc p{margin:0}
  .more{border:0;background:transparent;color:var(--accent);padding:4px 0;font-size:13.5px;font-weight:600}
  .wh{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .wh span{font-size:12.5px;padding:6px 10px;border-radius:999px;background:var(--bg2);display:flex;align-items:center;gap:6px}
  .wh span i{width:7px;height:7px;border-radius:50%;background:var(--off)}
  .wh .ok i{background:var(--ok)}.wh .low i{background:var(--low)}.wh .no{color:var(--hint)}
  .whcap{font-size:12.5px;color:var(--hint);margin-top:16px}

  /* ── корзина ── */
  .head{display:flex;align-items:baseline;gap:10px;padding:18px 2px 12px}
  .head h1{font-size:22px}.head span{color:var(--hint);font-size:14px}
  .line{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--r-md);padding:10px;margin-bottom:8px}
  .line .ph{width:66px;height:66px;flex:0 0 66px;border-radius:12px;aspect-ratio:auto}
  .line .ph img{padding:6%}.line .ph .flac{font-size:9px}
  .line .t{flex:1;min-width:0}
  .line .t b{display:block;font:600 13.5px/1.25 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line .t span{font-size:12px;color:var(--hint)}
  .line .t .p{display:block;color:var(--text);font-weight:600;margin-top:3px;font-size:14px}
  .total{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:var(--r-md);padding:14px 16px;margin:4px 0 12px}
  .total b{font:600 20px var(--display)}
  .hint{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--hint);padding:2px 4px 14px}

  /* ── форма ── */
  .f{display:block;margin-top:12px}
  .f span{display:block;font-size:12.5px;color:var(--hint);margin:0 0 6px 2px}
  .f input,.f textarea{width:100%;border:0;border-radius:var(--r-sm);background:var(--bg2);color:var(--text);padding:13px 14px;font:inherit;outline:none}
  .f textarea{min-height:84px;resize:none}
  .f input.bad{box-shadow:0 0 0 2px #e0544f inset}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{border:0;background:var(--bg2);border-radius:999px;padding:9px 14px;font-size:13.5px}
  .seg button.on{background:var(--accent);color:var(--accent-ink)}
  .addc{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:12px 2px 0}

  /* ── заказы ── */
  .oc{background:var(--card);border-radius:var(--r-md);padding:14px;margin-bottom:8px;display:flex;gap:14px;align-items:center;cursor:pointer;border:0;width:100%;text-align:left}
  .oc .bt{flex:0 0 38px}
  .oc .mid{flex:1;min-width:0}
  .oc .mid b{display:block;font:600 14.5px var(--display)}
  .oc .mid .st{display:block;font-size:13px;font-weight:600;color:var(--sc);margin-top:1px}
  .oc .mid .dt{display:block;font-size:12.5px;color:var(--hint)}
  .oc .sum{font-weight:600;white-space:nowrap}
  .thumbs{display:flex;gap:4px;margin-top:8px}
  .thumbs i{width:30px;height:30px;border-radius:8px;background:#fff center/contain no-repeat;border:1px solid var(--line);display:grid;place-items:center;font:600 9px var(--display);font-style:normal;color:#6b5f70}
  .bigbt{display:flex;gap:16px;align-items:center;padding:6px 0 4px}
  .bigbt .t h2{font-size:20px}.bigbt .t p{margin:4px 0 0;color:var(--hint);font-size:14px}
  .bigbt .t .st{color:var(--sc);font-weight:600}
  .tl{list-style:none;margin:16px 0 0;padding:0}
  .tl li{position:relative;padding:0 0 16px 30px;font-size:14px;color:var(--hint)}
  .tl li::before{content:"";position:absolute;left:6px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--bg2);box-shadow:0 0 0 2px var(--line) inset}
  .tl li::after{content:"";position:absolute;left:11px;top:18px;bottom:-2px;width:2px;background:var(--line)}
  .tl li:last-child::after{display:none}
  .tl li.done{color:var(--text)}
  .tl li.done::before{background:var(--sc);box-shadow:none}
  .tl li.done::after{background:var(--sc)}
  .tl li.now{color:var(--text);font-weight:600}
  .tl li.now::before{background:var(--bg);box-shadow:0 0 0 3px var(--sc) inset;animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  .track{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-top:6px;display:flex;align-items:center;gap:10px}
  .track .n{flex:1;min-width:0}.track .n span{display:block;font-size:12px;color:var(--hint)}
  .track .n b{font-size:16px;letter-spacing:.5px;word-break:break-all}
  .track button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px}
  .olist{margin-top:14px}
  .oi{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .oi .ph{width:44px;height:44px;flex:0 0 44px;border-radius:10px;aspect-ratio:auto}
  .oi .ph .flac{font-size:7px}
  .oi .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .oi .q{color:var(--hint)}
  .acts{display:grid;gap:8px;margin-top:16px}
  .upd{font-size:12px;color:var(--hint);text-align:center;margin:14px 0 4px}

  /* ── помощь ── */
  .tgbtn{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:var(--r-md);padding:14px;width:100%;text-align:left}
  .tgbtn .ic{width:42px;height:42px;border-radius:14px;background:#2aabee;color:#fff;display:grid;place-items:center;flex:0 0 42px}
  .tgbtn b{display:block}.tgbtn span{font-size:13px;color:var(--hint)}
  .box{background:var(--card);border-radius:var(--r-md);padding:14px;margin-top:10px}
  .box h2{font-size:16px;margin-bottom:10px}

  /* ── таббар ── */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
  .tab{border:0;background:transparent;color:var(--hint);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;position:relative}
  .tab svg{width:24px;height:24px;transition:transform .2s}
  .tab.on{color:var(--accent)}
  .tab.on svg{transform:translateY(-1px)}
  .tab .cnt{position:absolute;top:0;left:calc(50% + 5px);background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:600;
    min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:none;place-items:center}
  .tab .cnt.bump{animation:pop .35s ease}
  .tab .dot{position:absolute;top:2px;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:var(--low);display:none}

  .toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
    background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13.5px;z-index:60;transition:all .25s;pointer-events:none;white-space:nowrap}
  .toast.on{transform:translate(-50%,0);opacity:1}
  .fly{position:fixed;z-index:70;width:14px;height:14px;border-radius:50%;background:var(--accent);pointer-events:none;
    transition:transform .55s cubic-bezier(.5,-.3,.7,1),opacity .55s}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<!-- ═════════════ МАГАЗИН ═════════════ -->
<section id="shop">
  <div class="top"><div class="wrap">
    <div class="hello"><h1 id="hello">Магазин ESSENS</h1><div class="ava" id="ava"></div></div>
    <div class="search" id="sbox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Аромат, код или средство" autocomplete="off" aria-label="Поиск">
      <button class="x" id="qx" aria-label="Очистить">×</button>
    </div>
    <div class="cats" id="cats">
      <button class="cat on" data-g="all" style="--c:#8e3b79"><span class="ic">✨</span>Всё</button>
      <button class="cat" data-g="perf" style="--c:#e46a9a"><span class="ic">🌸</span>Ароматы</button>
      <button class="cat" data-g="beauty" style="--c:#f08a5d"><span class="ic">💄</span>Уход</button>
      <button class="cat" data-g="health" style="--c:#5fa35a"><span class="ic">🌿</span>Здоровье</button>
      <button class="cat" data-g="home" style="--c:#3ba7c9"><span class="ic">🏠</span>Дом</button>
    </div>
    <div class="chips" id="schips" style="display:none"></div>
    <div class="chips" id="fchips" style="display:none"></div>
  </div></div>
  <div class="wrap">
    <div class="bar"><span id="found"></span>
      <button class="sortb" id="sort"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg><span id="sortL">Порядок</span></button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none"><div class="big">🔎</div><h2>Ничего не нашлось</h2><div>Попробуйте другое слово или код</div></div>
  </div>
</section>

<!-- ═════════════ КОРЗИНА ═════════════ -->
<section id="cart"><div class="wrap">
  <div class="head"><h1>Корзина</h1><span id="cartN"></span></div>
  <div id="cartEmpty" class="empty">
    <div class="big">🧺</div><h2>Пока пусто</h2><div style="margin-bottom:16px">Добавьте что-нибудь из магазина</div>

</div></section>

  <div id="oEmpty" class="empty">

<section id="support"><div class="wrap">

    <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 4.3 2.9 11.5c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.5-1.5zM8.2 14.3l9.9-6.2c.5-.3.9-.1.5.2l-8.5 7.6-.3 3.6z"/></svg></span>
    <div><b id="directName"></b><span>Ответим лично в Telegram</span></div>

    </div>
    <label class="f"><textarea id="sText" maxlength="1500" placeholder="Ваш вопрос"></textarea></label>
    <button class="btn" id="sSend" style="margin-top:12px">Отправить</button>
  </div>
</div></section>

<!-- ═════════════ ШТОРКА ═════════════ -->
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab" id="grab"><i></i></div>
  <div class="sc"><div class="in-wrap" id="sheetIn"></div></div>
  <div class="foot" id="sheetFoot"></div>
</div>

<div class="toast" id="toast"></div>

<nav class="tabs"><div class="in">
  <button class="tab" data-t="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 3h6v3H9z"/><path d="M8 6h8a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z"/><path d="M8.5 13.5c2-1 4.5 1 7 0"/></svg>Магазин</button>
  <button class="tab" data-t="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h16l-1.5 11a2 2 0 0 1-2 1.7h-9a2 2 0 0 1-2-1.7z"/><path d="M8.5 8a3.5 3.5 0 0 1 7 0"/></svg>Корзина<span class="cnt" id="tabCnt"></span></button>
  <button class="tab" data-t="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg>Заказы<span class="dot" id="oDot"></span></button>
  <button class="tab" data-t="support"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" stroke-width="2.6" stroke-linecap="round"/></svg>Помощь</button>
</div></nav>

<script>
/* ═══════ Настройки из адреса (их подставляет бот) ═══════ */
const P = new URLSearchParams(location.search);
const CFG = {
  bot:     P.get("bot")  || "",
  shop:    P.get("shop") || "Магазин ESSENS",
  support: (P.get("support") || "").replace(/^@/, ""),
  crypto:  P.get("crypto") === "1",
  pm:      P.get("pm") === "card" ? "card" : "essens",
  dn:      P.get("dn") || "",
};
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.platform && tg.platform !== "unknown");
const canSend = inTG && !(tg.initDataUnsafe && tg.initDataUnsafe.query_id);  // sendData — только с кнопки клавиатуры
if (inTG) { tg.ready(); tg.expand(); document.documentElement.classList.add("tg");
  if (tg.colorScheme === "dark") document.documentElement.classList.add("dark");
  try { tg.setHeaderColor("bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch(e){}
  tg.onEvent && tg.onEvent("themeChanged", () => document.documentElement.classList.toggle("dark", tg.colorScheme === "dark")); }

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub = n => Math.round(n).toLocaleString("ru-RU") + " ₽";
const plural = (n, f) => { const a=n%100, b=n%10; return f[a>10&&a<20?2:b===1?0:b>=2&&b<=4?1:2]; };
const haptic = (t="light") => { try { tg.HapticFeedback.impactOccurred(t); } catch(e){} };
const notify = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch(e){} };
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
                set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),1700); }
function openLink(u){ inTG ? tg.openLink(u) : window.open(u, "_blank", "noopener"); }
function openBot(param){
  if (!CFG.bot) return toast("Откройте магазин из чата с ботом");
  const l = `https://t.me/${CFG.bot}` + (param ? `?start=${param}` : "");
  if (inTG) { tg.openTelegramLink(l); tg.close(); } else window.open(l, "_blank");
}

/* ═══════ Приветствие ═══════ */
const U = inTG && tg.initDataUnsafe && tg.initDataUnsafe.user;
document.title = CFG.shop;
if (U && U.first_name) {
  $("#hello").textContent = `Привет, ${U.first_name}!`;
  $("#ava").innerHTML = U.photo_url ? `<img src="${esc(U.photo_url)}" alt="">` : esc(U.first_name[0]);
} else { $("#hello").textContent = CFG.shop; $("#ava").textContent = "E"; }

/* ═══════ Цвет аромата ═══════ */
const SCENTS = [["цвет","#e46a9a"],["фрукт","#f08a5d"],["цитрус","#e2b21f"],["водн","#3ba7c9"],["свеж","#3ba7c9"],["зел","#5fa35a"],["фуж","#6e9c7a"],
  ["шипр","#8c8a45"],["древес","#a86b42"],["пря","#c4553a"],["гурман","#c98b4b"],["бальзам","#b5733a"],["восточ","#7b4bb3"],["мускус","#9a7fa8"]];
const GROUPC = {perf:"#e46a9a", beauty:"#f08a5d", health:"#5fa35a", home:"#3ba7c9"};
function color(p){
  const f = (p.family || "").toLowerCase(); let best = null, at = 1e9;
  for (const [k, c] of SCENTS) { const i = f.indexOf(k); if (i >= 0 && i < at) { at = i; best = c; } }
  return best || GROUPC[((p.subs || [])[0] || "perf").split(":")[0]] || "#8e3b79";
}
const SUBS = {"perf:w":"Женские","perf:m":"Мужские","perf:lux":"Luxury","perf:uni":"Унисекс","perf:probe":"Пробники","perf:set":"Наборы","perf:mist":"Спреи для тела","perf:kids":"Детские",
  "beauty:face":"Лицо","beauty:eyes":"Глаза","beauty:lips":"Губы","beauty:aloe":"Aloe Vera","beauty:col":"Colostrum","beauty:body":"Тело и душ","beauty:sun":"Солнце",
  "health:vit":"Витамины","health:aloe":"Алоэ","health:col":"Colostrum","health:pharm":"Home Pharmacy","health:lac":"Lactoferrin","health:can":"Canassens",
  "home:clean":"Уборка","home:aroma":"Ароматы для дома","home:oils":"Эфирные масла"};
const FAMS = [["","Любой",""],["цвет","Цветочные","#e46a9a"],["фрукт","Фруктовые","#f08a5d"],["свеж","Свежие","#3ba7c9"],["древес","Древесные","#a86b42"],["восточ","Восточные","#7b4bb3"],["сладк","Сладкие","#c98b4b"]];

/* ═══════ Каталог ═══════ */
let PRODUCTS = [], BY = {}, STOCK = null;
let group = "all", sub = "", query = "", sortMode = 0, fam = "";
const SORTS = ["Порядок", "Дешевле", "Дороже"];
function subName(p){ return SUBS[(p.subs || [])[0]] || ""; }
function name(p){ return p.title || p.name; }
function small(p){
  const parts = [];
  if (p.code && !(p.title || p.name || "").includes(p.code)) parts.push(p.code);
  if (p.title && p.title !== p.name && !/^(Пробник|Набор|Гель)/.test(p.title) && p.cat !== "w" && p.cat !== "m") parts.push(p.name);
  if (p.volume) parts.push(p.volume);
  return parts.join(", ");
}
function scentLabel(p){
  if (p.family) return p.family;
  return subName(p);
}
function pic(p, cls="ph"){
  const c = color(p);
  const fb = `<div class=&quot;flac&quot;>${esc(p.code || "")}</div>`;
  const inner = p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.outerHTML='${fb}'">` : `<div class="flac">${esc(p.code || "")}</div>`;
  return `<div class="${cls}" style="--c:${c}" data-open="${esc(p.id)}">${inner}${cls === "ph" ? badge(p) : ""}</div>`;
}
function badge(p){
  if (!p.stock) return '<span class="tag">Нет в наличии</span>';
  if (p.wh && !p.wh.some(x => x === 2)) return '<span class="tag low">Мало</span>';
  return "";
}
function ctl(p){
  if (!p.stock) return "";
  const q = cart[p.id] || 0;
  return q ? `<div class="step"><button data-dec="${esc(p.id)}" aria-label="Меньше">−</button><span>${q}</span><button data-inc="${esc(p.id)}" aria-label="Больше">+</button></div>`
           : `<button class="add" data-inc="${esc(p.id)}" aria-label="В корзину"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>`;
}
function card(p){
  return `<article class="pc${p.stock ? "" : " off"}" id="pc-${esc(p.id)}">${pic(p)}
    <div class="pi"><div class="scent" style="--c:${color(p)}"><i></i>${esc(scentLabel(p))}</div>
      <h3 data-open="${esc(p.id)}">${esc(name(p))}</h3><div class="sm">${esc(small(p))}</div>
      <div class="buy"><b>${rub(p.price)}</b><span class="ctl">${ctl(p)}</span></div></div></article>`;
}
function hay(p){ return [p.title, p.inspired, p.code, p.name, p.id, p.family, p.notes, ...(p.top||[]), ...(p.heart||[]), ...(p.base||[])].join(" ").toLowerCase(); }
function famMatch(p){
  if (!fam) return true;
  const f = (p.family || "").toLowerCase(), notes = [...(p.top||[]), ...(p.heart||[]), ...(p.base||[])].join(" ");
  if (fam === "свеж")  return /цитрус|водн|зелён|фужер/.test(f);
  if (fam === "сладк") return /гурман/.test(f) || /ванил|карамел|пралине|шоколад|мёд|сливки|какао/.test(notes);
  return f.includes(fam);
}
let shown = [], page = 0;
const PAGE = 40;
function renderGrid(){
  const q = query.trim().toLowerCase();
  shown = PRODUCTS.filter(p => (group === "all" || (p.subs || []).some(s => s.startsWith(group + ":"))) &&
    (!sub || (p.subs || []).includes(sub)) && famMatch(p) && (!q || hay(p).includes(q)));
  if (sortMode) shown = [...shown].sort((a,b) => sortMode === 1 ? a.price - b.price : b.price - a.price);
  page = 1;
  $("#grid").innerHTML = shown.slice(0, PAGE).map(card).join("");
  $("#empty").style.display = shown.length ? "none" : "block";
  $("#found").textContent = shown.length + " " + plural(shown.length, ["товар","товара","товаров"]);
}
function moreGrid(){
  if (page * PAGE >= shown.length) return;
  $("#grid").insertAdjacentHTML("beforeend", shown.slice(page * PAGE, (page + 1) * PAGE).map(card).join("")); page++;
}
window.addEventListener("scroll", () => { if (current === "shop" && innerHeight + scrollY > document.body.scrollHeight - 900) moreGrid(); }, {passive:true});
function refreshCard(id){ const el = document.querySelector(`#pc-${CSS.escape(id)} .ctl`); if (el) el.innerHTML = ctl(BY[id]); }

function renderChips(){
  const keys = Object.keys(SUBS).filter(k => k.startsWith(group + ":") && PRODUCTS.some(p => (p.subs || []).includes(k)));
  const box = $("#schips"); box.style.display = keys.length ? "flex" : "none";
  box.innerHTML = `<button class="chip${sub ? "" : " on"}" data-s="">Все</button>` +
    keys.map(k => `<button class="chip${sub === k ? " on" : ""}" data-s="${k}">${esc(SUBS[k])}</button>`).join("");
  const showFam = group === "perf" && !["perf:mist","perf:kids","perf:set"].includes(sub);
  if (!showFam) fam = "";
  const fb = $("#fchips"); fb.style.display = showFam ? "flex" : "none";
  fb.innerHTML = FAMS.map(([k, l, c]) => `<button class="chip${fam === k ? " on" : ""}" data-f="${k}">${c ? `<i style="--c:${c}"></i>` : ""}${l}</button>`).join("");
}
$("#schips").onclick = e => { const b = e.target.closest("[data-s]"); if (!b) return; sub = b.dataset.s; renderChips(); renderGrid(); haptic(); };
$("#fchips").onclick = e => { const b = e.target.closest("[data-f]"); if (!b) return; fam = b.dataset.f; renderChips(); renderGrid(); haptic(); };
$("#cats").onclick = e => { const b = e.target.closest("[data-g]"); if (!b) return;
  $$(".cat").forEach(x => x.classList.toggle("on", x === b)); group = b.dataset.g; sub = ""; fam = ""; renderChips(); renderGrid(); haptic(); };
let qt; $("#q").oninput = e => { query = e.target.value; $("#sbox").classList.toggle("has", !!query); clearTimeout(qt); qt = setTimeout(renderGrid, 120); };
$("#qx").onclick = () => { $("#q").value = ""; query = ""; $("#sbox").classList.remove("has"); renderGrid(); };
$("#sort").onclick = () => { sortMode = (sortMode + 1) % 3; $("#sortL").textContent = SORTS[sortMode]; renderGrid(); haptic(); };

/* ═══════ Корзина ═══════ */
const TRASH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
let cart = store.get("essens_cart", {}) || {};
const saveCart = () => store.set("essens_cart", cart);
function setQty(id, q){
  q = Math.max(0, Math.min(20, q));
  if (q) cart[id] = q; else delete cart[id];
  saveCart(); refreshCard(id); updateBadge();
  if (sheetKind === "product" && sheetId === id) renderProductFoot(id);
  if (current === "cart") renderCart();
}
const cartItems = () => Object.entries(cart).filter(([id]) => BY[id] && BY[id].stock);
const cartTotal = () => cartItems().reduce((s,[id,q]) => s + BY[id].price * q, 0);
const cartCount = () => cartItems().reduce((s,[,q]) => s + q, 0);
function updateBadge(bump){
  const n = cartCount(), c = $("#tabCnt");
  c.textContent = n; c.style.display = n ? "grid" : "none";
  if (bump) { c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
}
function fly(from){
  const r = from.getBoundingClientRect(), t = $('.tab[data-t="cart"]').getBoundingClientRect();
  const d = document.createElement("div"); d.className = "fly";
  d.style.left = (r.left + r.width/2 - 7) + "px"; d.style.top = (r.top + r.height/2 - 7) + "px";
  document.body.appendChild(d);
  requestAnimationFrame(() => { d.style.transform = `translate(${t.left + t.width/2 - r.left - r.width/2}px, ${t.top + 8 - r.top - r.height/2}px) scale(.6)`; d.style.opacity = ".2"; });
  setTimeout(() => { d.remove(); updateBadge(true); }, 560);
}
function renderCart(){
  const items = cartItems(), n = cartCount();
  $("#cartN").textContent = n ? `${n} ${plural(n,["товар","товара","товаров"])}` : "";
  $("#cartEmpty").style.display = items.length ? "none" : "block";
  $("#cartFull").style.display = items.length ? "block" : "none";
  if (!items.length) return;
  $("#lines").innerHTML = items.map(([id,q]) => { const p = BY[id]; return `
    <div class="line">${pic(p, "ph")}
      <div class="t"><b>${esc(name(p))}</b><span>${esc(small(p))}</span><span class="p">${rub(p.price*q)}</span></div>
      <div class="step"><button data-dec="${esc(id)}" aria-label="${q === 1 ? "Удалить" : "Меньше"}">${q === 1 ? TRASH : "−"}</button><span>${q}</span><button data-inc="${esc(id)}" aria-label="Больше">+</button></div></div>`; }).join("");
  $("#sum").textContent = rub(cartTotal());
  $("#checkout").textContent = "Оформить · " + rub(cartTotal());
  $("#payHint").innerHTML = CFG.pm === "essens"
    ? "<span>💳</span><span>Оплата на сайте ESSENS — ссылку пришлём в чат</span>"
    : "<span>💳</span><span>Реквизиты для оплаты придут в чат</span>";
}

/* ═══════ Шторка ═══════ */
let sheetKind = "", sheetId = "";
function openSheet(kind, id, html, foot){
  sheetKind = kind; sheetId = id;
  $("#sheetIn").innerHTML = html; $("#sheetFoot").innerHTML = foot || ""; $("#sheetFoot").style.display = foot ? "flex" : "none";
  $("#sheet .sc").scrollTop = 0;
  $("#ov").classList.add("on"); $("#sheet").classList.add("on"); $("#sheet").style.transform = "";
  if (inTG && tg.BackButton) { tg.BackButton.show(); }
  haptic();
}
function closeSheet(){
  $("#ov").classList.remove("on"); $("#sheet").classList.remove("on"); $("#sheet").style.transform = "";
  sheetKind = ""; sheetId = "";
  if (inTG && tg.BackButton) tg.BackButton.hide();
}
$("#ov").onclick = closeSheet;
if (inTG && tg.BackButton) tg.BackButton.onClick(closeSheet);
(() => { // свайп вниз закрывает шторку
  let y0 = null, dy = 0; const g = $("#grab"), s = $("#sheet");
  g.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; dy = 0; s.style.transition = "none"; }, {passive:true});
  g.addEventListener("touchmove", e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); s.style.transform = `translateY(${dy}px)`; }, {passive:true});
  g.addEventListener("touchend", () => { s.style.transition = ""; if (dy > 90) closeSheet(); else s.style.transform = ""; y0 = null; });
})();

/* ═══════ Товар ═══════ */
function productHTML(p){
  const notes = [["Сначала", p.top], ["Сердце", p.heart], ["Шлейф", p.base]].filter(([, a]) => a && a.length);
  let wh = "";
  if (p.wh && STOCK) {
    const L = {2:["ok","есть"],1:["low","мало"],0:["no","нет"]};
    wh = `<div class="whcap">Где есть сейчас</div><div class="wh">` + STOCK.wh.map(([, n], i) => { const [c, t] = L[p.wh[i] ?? 0];
      return `<span class="${c}"><i></i>${esc(n)}${c === "ok" ? "" : ", " + t}</span>`; }).join("") + `</div>`;
  }
  let text = p.notes || "";
  if (notes.length) text = text.split(/(?<=\.)\s+/).filter(x => !/^(Открывается нотами|В сердце|В шлейфе)/.test(x)).join(" ");
  const long = text.length > 170;
  const sameInsp = p.inspired && name(p).includes(p.inspired);
  return `${pic(p, "pimg")}
    ${sameInsp ? `<div class="kick">Ноты аромата, вдохновлённые</div>` : ""}
    <div class="ptitle">${esc(name(p))}</div><div class="psub">${esc(small(p) || subName(p))}</div>
    ${p.inspired && !sameInsp ? `<div class="insp"><span>Ноты аромата, вдохновлённые</span><b>${esc(p.inspired)}</b></div>` : ""}
    ${notes.length ? `<div class="notes">${notes.map(([l, a]) => `<div><span>${l}</span>${esc(a.join(", "))}</div>`).join("")}</div>` : ""}
    ${text ? `<div class="desc${long ? " cut" : ""}" id="desc"><p>${esc(text)}</p>${long ? '<button class="more" id="more">Читать полностью</button>' : ""}</div>` : ""}
    ${wh}`;
}
function renderProductFoot(id){
  const p = BY[id], q = cart[id] || 0;
  $("#sheetFoot").innerHTML = `<span class="price">${rub(p.price)}</span>` + (!p.stock ? '<span class="muted">Нет в наличии</span>' : q
    ? `<div class="step"><button data-dec="${esc(id)}">−</button><span>${q}</span><button data-inc="${esc(id)}">+</button></div><button class="btn soft" data-go="cart">В корзину</button>`
    : `<button class="btn" data-inc="${esc(id)}">Добавить</button>`);
}
function openProduct(id){
  const p = BY[id]; if (!p) return;
  openSheet("product", id, productHTML(p), " "); renderProductFoot(id);
}
$("#sheetIn").addEventListener("click", e => { if (e.target.id === "more") { $("#desc").classList.remove("cut"); e.target.remove(); } });

/* ═══════ Оформление ═══════ */
function checkoutHTML(){
  const me = store.get("essens_me", {});
  const nm = me.name || (U ? [U.first_name, U.last_name].filter(Boolean).join(" ") : "");
  const card = CFG.pm === "card";
  return `<div class="ptitle" style="margin-top:4px">Оформление</div>
    <div class="psub">${cartCount()} ${plural(cartCount(),["товар","товара","товаров"])} на ${rub(cartTotal())}</div>
    <label class="f"><span>Имя и фамилия</span><input id="oName" maxlength="80" autocomplete="name" value="${esc(nm)}" placeholder="Анна Иванова"></label>
    <label class="f"><span>Телефон</span><input id="oPhone" maxlength="20" inputmode="tel" autocomplete="tel" value="${esc(me.phone || "")}" placeholder="+7 900 000-00-00"></label>
    ${card ? `<div class="f"><span>Доставка</span><div class="seg" id="dl"><button class="on">СДЭК</button><button>Почта России</button><button>Самовывоз</button></div></div>
      <label class="f"><span>Город и адрес</span><input id="oAddr" maxlength="200" value="${esc(me.addr || "")}" placeholder="Москва, ул. Ленина, 1"></label>` : ""}
    ${CFG.crypto ? `<div class="f"><span>Оплата</span><div class="seg" id="pay"><button class="on" data-v="${CFG.pm}">${card ? "Карта" : "Сайт ESSENS"}</button><button data-v="crypto">Крипта</button></div></div>` : ""}
    <div id="cmtWrap" style="display:none"><label class="f"><span>Комментарий</span><textarea id="oComment" maxlength="500"></textarea></label></div>
    <button class="addc" id="addCmt">+ Комментарий</button>
    <div id="notTG" class="hint" style="display:none;padding-top:14px"><span>👇</span><span>Чтобы отправить заказ, откройте магазин кнопкой «Магазин» внизу чата. Корзина сохранится.</span></div>`;
}
function openCheckout(){
  if (!cartItems().length) return;
  openSheet("checkout", "", checkoutHTML(), `<button class="btn" id="send">Отправить заказ</button>`);
}
$("#checkout").onclick = openCheckout;
$("#sheet").addEventListener("click", e => {
  const segBtn = e.target.closest(".seg button");
  if (segBtn) { segBtn.parentNode.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === segBtn)); haptic(); }
  if (e.target.id === "addCmt") { $("#cmtWrap").style.display = "block"; e.target.remove(); $("#oComment").focus(); }
  if (e.target.id === "send") sendOrder();
  if (e.target.id === "toBot") openBot();
});
function sendOrder(){
  const items = cartItems(); if (!items.length) return;
  const nm = $("#oName"), ph = $("#oPhone"), ad = $("#oAddr");
  const dl = $("#dl .on") ? $("#dl .on").textContent : "";
  const bad = [];
  if (nm.value.trim().length < 2) bad.push(nm);
  if (ph.value.replace(/\D/g,"").length < 10) bad.push(ph);
  if (ad && dl !== "Самовывоз" && ad.value.trim().length < 5) bad.push(ad);
  [nm, ph, ad].forEach(i => i && i.classList.toggle("bad", bad.includes(i)));
  if (bad.length) { bad[0].focus(); notify("error"); toast("Проверьте отмеченные поля"); return; }
  store.set("essens_me", { name: nm.value.trim(), phone: ph.value.trim(), addr: ad ? ad.value.trim() : "" });
  const order = { type: "order", items: items.map(([id,q]) => [id, q]),
    name: nm.value.trim().slice(0,80), phone: ph.value.trim().slice(0,20),
    delivery: ad ? dl : "", address: ad ? ad.value.trim().slice(0,200) : "",
    pay: $("#pay .on") ? $("#pay .on").dataset.v : CFG.pm,
    comment: ($("#oComment") ? $("#oComment").value.trim() : "").slice(0,500), total: cartTotal() };
  if (!canSend) { $("#notTG").style.display = "flex"; $("#sheetFoot").innerHTML = `<button class="btn" id="toBot">Перейти в чат</button>`; return; }
  notify("success"); cart = {}; saveCart();
  tg.sendData(JSON.stringify(order));           // бот получит заказ, окно закроется
}

/* ═══════ Заказы (история приходит от бота в ссылке) ═══════ */
function b64json(s){
  try { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
        return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)))); } catch(e){ return null; }
}
// Бот кладёт в ссылку только последние заказы; на телефоне копится вся история
let OD = (() => {
  const fresh = b64json(P.get("o") || ""), old = store.get("essens_orders", null);
  if (!fresh) return old;
  if (!old || !old.o) { store.set("essens_orders", fresh); return fresh; }
  const newer = fresh.t >= old.t ? fresh : old, other = newer === fresh ? old : fresh;
  const byId = new Map(other.o.map(o => [o[0], o]));
  newer.o.forEach(o => byId.set(o[0], o));
  const merged = {t: newer.t, o: [...byId.values()].sort((a, b) => b[0] - a[0]).slice(0, 40)};
  store.set("essens_orders", merged); return merged;
})();
// [id, статус, время, сумма, оплата, корзина, трек, ссылка трека, № ESSENS, статус ESSENS, [[товар, шт]]]
// s — наполненность флакона, d — сколько этапов пройдено, now — текущий этап (-1 — нет)
const ST = {
  n: {l:"Собираем корзину", c:"#e08a1e", s:1, d:1, now:1},
  l: {l:"Ждёт оплаты", c:"#e08a1e", s:2, d:1, now:1},
  c: {l:"Проверяем оплату", c:"#e08a1e", s:2, d:1, now:2},
  p: {l:"Оплачен", c:"var(--accent)", s:3, d:3, now:3},
  s: {l:"В пути", c:"#2f9e5b", s:4, d:4, now:-1},
  x: {l:"Отменён", c:"#9a93a0", s:0, d:0, now:-1},
};
function stInfo(o){
  const st = ST[o[1]] || ST.n;
  if (o[4] !== "e" && o[1] === "n") return {...st, l:"Ждёт оплаты", s:1, d:1, now:1};
  return st;
}
function stepsFor(o){
  return o[4] === "e" ? ["Заказ принят", "Оплата на сайте ESSENS", "Оплачен", "Передан в доставку"]
                      : ["Заказ принят", "Оплата", "Оплачен", "Передан в доставку"];
}
function bottle(level, c, size=38){   // флакон, наполненный по этапу заказа (0–4)
  const h = [0, .25, .5, .75, 1][level] ?? 0;
  return `<svg width="${size}" height="${size * 1.25}" viewBox="0 0 32 40" fill="none" aria-hidden="true">
    <defs><clipPath id="cl${size}"><path d="M6 15a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v19a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z"/></clipPath></defs>
    <g clip-path="url(#cl${size})"><rect class="juice" data-h="${h}" x="4" y="11" width="24" height="29" style="fill:${c};opacity:.85;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(${size === 64 ? 0 : h});transition:transform 1s cubic-bezier(.3,1.25,.45,1)"/></g>
    <path d="M6 15a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v19a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" stroke="currentColor" stroke-width="1.8"/>
    <path d="M12 4h8v7h-8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}
const fmtDate = t => new Date(t * 1000).toLocaleDateString("ru-RU", {day:"numeric", month:"short"});
function itemsCount(o){ return (o[10] || []).reduce((s, [, q]) => s + q, 0); }
function renderOrders(){
  const list = (OD && OD.o) || [];
  $("#oEmpty").style.display = list.length ? "none" : "block";
  $("#olist").innerHTML = list.map(o => { const st = stInfo(o), n = itemsCount(o);
    const th = (o[10] || []).slice(0, 5).map(([id]) => { const p = BY[id];
      return p && p.img ? `<i style="background-image:url('${esc(p.img)}')"></i>` : `<i>${esc(p ? p.code : id).slice(0,4)}</i>`; }).join("");
    return `<button class="oc" data-order="${o[0]}" style="--sc:${st.c}"><span class="bt" style="color:var(--hint)">${bottle(st.s, st.c)}</span>
      <span class="mid"><b>Заказ №${o[0]}</b><span class="st">${esc(o[1] === "p" && o[9] ? o[9] : st.l)}</span>
        <span class="dt">${fmtDate(o[2])}, ${n} ${plural(n,["товар","товара","товаров"])}</span>
        <span class="thumbs">${th}</span></span>
      <span class="sum">${rub(o[3])}</span></button>`; }).join("");
  $("#oUpd").textContent = OD && OD.t ? "Обновлено " + new Date(OD.t * 1000).toLocaleString("ru-RU", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "";
  const attention = list.some(o => o[1] === "l");
  $("#oDot").style.display = attention ? "block" : "none";
}
function trackURL(o){ if (!o[6]) return ""; if (o[7] === "c") return "https://www.cdek.ru/track.html?order_id=" + encodeURIComponent(o[6]);
  if (o[7] === "p") return "https://www.pochta.ru/tracking#" + encodeURIComponent(o[6]); return /^https:\/\//.test(o[7] || "") ? o[7] : ""; }
function payURL(o){ return o[5] ? new URL("pay.html?id=" + encodeURIComponent(o[5]), location.href).href : ""; }
function openOrder(id){
  const o = ((OD && OD.o) || []).find(x => String(x[0]) === String(id)); if (!o) return;
  const st = stInfo(o), steps = stepsFor(o);
  const tl = o[1] === "x" ? `<li class="now">Заказ отменён</li>` :
    steps.map((s, i) => `<li class="${i < st.d ? "done" : i === st.now ? "now" : ""}">${s}</li>`).join("");
  const items = (o[10] || []).map(([pid, q]) => { const p = BY[pid];
    return `<div class="oi">${p ? pic(p, "ph") : '<div class="ph"></div>'}<span class="n">${esc(p ? name(p) : pid)}</span><span class="q">× ${q}</span></div>`; }).join("");
  const tu = trackURL(o);
  const html = `<div class="bigbt" style="--sc:${st.c}"><span id="bigB" style="color:var(--hint)">${bottle(st.s, st.c, 64)}</span>
      <div class="t"><h2>Заказ №${o[0]}</h2><p><span class="st">${esc(st.l)}</span></p><p>${fmtDate(o[2])}, ${rub(o[3])}${o[8] ? `<br>№ ESSENS ${esc(o[8])}` : ""}</p></div></div>
    <ul class="tl" style="--sc:${st.c}">${tl}</ul>
    ${o[6] ? `<div class="track"><div class="n"><span>Трек-номер</span><b>${esc(o[6])}</b></div><button data-copy="${esc(o[6])}">Копировать</button></div>` : ""}
    <div class="olist">${items}</div>`;
  const acts = [];
  if (o[1] === "l" && payURL(o)) acts.push(`<button class="btn" data-pay="${esc(payURL(o))}">Оплатить ${rub(o[3])}</button>`);
  if (tu) acts.push(`<button class="btn" data-url="${esc(tu)}">Отследить посылку</button>`);
  acts.push(`<button class="btn soft" data-repeat="${o[0]}">Повторить заказ</button>`);
  openSheet("order", String(o[0]), html + `<div class="acts">${acts.join("")}</div>`, "");
  setTimeout(() => { const r = document.querySelector("#bigB .juice"); if (r) r.style.transform = `scaleY(${r.dataset.h})`; }, 250);
}
function repeatOrder(id){
  const o = ((OD && OD.o) || []).find(x => String(x[0]) === String(id)); if (!o) return;
  let n = 0;
  for (const [pid, q] of o[10] || []) { const p = BY[pid]; if (p && p.stock) { cart[pid] = Math.min(20, (cart[pid] || 0) + q); n += q; } }
  saveCart(); updateBadge(true); closeSheet();
  if (n) { toast(`В корзине +${n} ${plural(n,["товар","товара","товаров"])}`); go("cart"); } else toast("Этих товаров сейчас нет в наличии");
}

/* ═══════ Помощь ═══════ */
if (/^[A-Za-z0-9_]{4,32}$/.test(CFG.support)) {
  $("#direct").style.display = "flex"; $("#directName").textContent = "@" + CFG.support;
  $("#direct").onclick = () => { const l = "https://t.me/" + CFG.support; inTG ? tg.openTelegramLink(l) : window.open(l, "_blank"); };
}
$("#topics").onclick = e => { const b = e.target.closest("button"); if (!b) return; $$("#topics button").forEach(x => x.classList.toggle("on", x === b)); haptic(); };
$("#sSend").onclick = () => {
  const text = $("#sText").value.trim(); if (!text) { $("#sText").focus(); notify("error"); return; }
  const payload = { type: "support", name: U ? [U.first_name, U.last_name].filter(Boolean).join(" ") : "",
                    topic: $("#topics .on").textContent, contact: "", text: text.slice(0, 1500) };
  if (canSend) { notify("success"); tg.sendData(JSON.stringify(payload)); return; }
  openBot("support");
};

/* ═══════ Клики ═══════ */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-inc],[data-dec],[data-open],[data-go],[data-order],[data-copy],[data-pay],[data-url],[data-repeat]"); if (!t) return;
  const d = t.dataset;
  if (d.inc) { const was = cart[d.inc] || 0; setQty(d.inc, was + 1); haptic(); if (!was) fly(t); else updateBadge(true); }
  else if (d.dec) { setQty(d.dec, (cart[d.dec] || 0) - 1); haptic(); }
  else if (d.open) openProduct(d.open);
  else if (d.go) { closeSheet(); go(d.go); }
  else if (d.order) openOrder(d.order);
  else if (d.copy) { (navigator.clipboard ? navigator.clipboard.writeText(d.copy) : Promise.reject()).then(() => toast("Скопировано"), () => toast(d.copy)); notify("success"); }
  else if (d.pay) openLink(d.pay);
  else if (d.url) openLink(d.url);
  else if (d.repeat) repeatOrder(d.repeat);
});

/* ═══════ Навигация ═══════ */
let current = "shop";
function go(id){
  current = id;
  $$("section").forEach(s => s.classList.toggle("on", s.id === id));
  $$(".tab").forEach(t => t.classList.toggle("on", t.dataset.t === id));
  if (id === "cart") renderCart();
  if (id === "orders") renderOrders();
  window.scrollTo(0, 0);
}
$$(".tab").forEach(t => t.onclick = () => { go(t.dataset.t); haptic(); });

/* ═══════ Старт ═══════ */
const startTab = P.get("tab") || (location.hash || "").replace(/^#/, "").split(/[&=]/)[0];
go(["shop","cart","orders","support"].includes(startTab) ? startTab : "shop");
$("#grid").innerHTML = Array.from({length: 6}, () => '<div class="skel"></div>').join("");
renderOrders();
const stockReq = fetch("stock.json?v=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null);
fetch("products.json?v=" + Date.now())
  .then(r => r.json())
  .then(async list => {
    PRODUCTS = list.filter(p => p && p.id && p.price > 0);
    const s = await stockReq;
    if (s && s.items && Array.isArray(s.wh)) {
      STOCK = s;
      for (const p of PRODUCTS) { const a = s.items[p.id]; if (Array.isArray(a)) { p.wh = a; if (p.stock !== false) p.stock = a.some(x => x > 0); } }
    }
    BY = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
    for (const id of Object.keys(cart)) if (!BY[id]) delete cart[id];
    renderChips(); renderGrid(); updateBadge(); renderOrders();
    if (current === "cart") renderCart();
    const openId = P.get("order"); if (openId) openOrder(openId);
  })
  .catch(() => { $("#grid").innerHTML = ""; $("#empty").style.display = "block";
                 $("#empty").innerHTML = '<div class="big">⚠️</div><h2>Каталог не загрузился</h2><div>Проверьте интернет и откройте магазин снова</div>'; });
</script>
